version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /mockserver
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # @sveltejs/kit's peer range caps typescript at ^6; take TypeScript
      # majors deliberately once the Svelte toolchain supports them.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # Track Node LTS lines only: odd majors (23, 25, ...) are short-lived
      # current releases, and CI + docs standardize on the LTS runtime.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
